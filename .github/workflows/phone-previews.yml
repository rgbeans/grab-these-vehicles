name: Capture Android previews
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phone-previews.yml'
      - 'tools/capture_previews.py'
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Build the unchanged app
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
          ./gradlew --no-daemon assembleDebug
      - name: Boot Android 15
        timeout-minutes: 8
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libnss3 libx11-6 libxcb1 libxcb-cursor0 libxkbcommon-x11-0 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 libxdamage1 libxfixes3 libegl1 libgl1 libasound2t64
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd --force --name previews --package "system-images;android-35;google_apis;x86_64" --device pixel_6
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd previews -no-window -noaudio -no-boot-anim -no-snapshot -no-metrics -memory 2048 -cores 2 -gpu swiftshader_indirect -feature -Vulkan > /tmp/emulator.log 2>&1 &
          emulator_pid=$!
          sleep 5
          kill -0 "$emulator_pid" || { cat /tmp/emulator.log; exit 1; }
          for attempt in $(seq 1 120); do
            kill -0 "$emulator_pid" || { cat /tmp/emulator.log; exit 1; }
            if [ "$(timeout 10 adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb install -r app/build/outputs/apk/debug/app-debug.apk
      - name: Capture app screens and notification
        run: python3 tools/capture_previews.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1.6.1-actual-screenshots
          path: build/phone-previews/
          if-no-files-found: warn
          retention-days: 14
      - name: Emulator diagnostics
        if: failure()
        run: |
          tail -100 /tmp/emulator.log || true
          timeout 10 adb logcat -d -t 200 || true
