name: Capture notification screenshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/notification-screenshot.yml', 'tools/capture_notification.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 tools/capture_notification.py
      - uses: actions/upload-artifact@v4
        with:
          name: notification-screenshot
          path: play-release/graphics/03-notification.png
